[project]
name = "tiny-duration-parse"
version = "0.1.0"
description = "Parse duration strings like 2h30m into structured components and convert them to a standard format."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
